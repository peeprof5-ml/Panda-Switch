<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PANDA-Switch | Cyber GPS Mocker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030712;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        /* Forces container to respect device navigation / home bars */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
        #map { width: 100%; height: 100%; z-index: 1; }
        .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out, .leaflet-attribution-flag {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }
    </style>
</head>
<body class="app-container">

    <!-- Top Cyber Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center z-20 shrink-0 shadow-lg">
        <div class="flex items-center space-x-2.5">
            <div class="bg-emerald-500 text-slate-950 p-2 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM7,9c0,-1.1 0.9,-2 2,-2s2,0.9 2,2 -0.9,2 -2,2 -2,-0.9 -2,-2zM15,9c0,-1.1 0.9,-2 2,-2s2,0.9 2,2 -0.9,2 -2,2 -2,-0.9 -2,-2zM12,17c-2.33,0 -4.31,-1.38 -5.22,-3.35l1.83,-0.74C9.13,13.84 10.46,14.5 12,14.5s2.87,-0.66 3.39,-1.59l1.83,0.74C16.31,15.62 14.33,17 12,17z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-sm font-black tracking-wider text-white">PANDA-<span class="text-emerald-400">Switch</span></h1>
                <p class="text-[9px] text-slate-400 font-mono tracking-tight">CYBER MOCK v2.2</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-2">
            <span id="status-badge" class="px-2.5 py-1 rounded-full text-[10px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20 flex items-center">
                <i class="fa-solid fa-circle text-[5px] mr-1 animate-pulse"></i> INACTIVE
            </span>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="flex flex-1 flex-col md:flex-row relative overflow-hidden">
        
        <!-- Interactive Map Viewport -->
        <main class="flex-1 relative w-full h-full order-1 md:order-2">
            <div id="map"></div>
        </main>

        <!-- Swift Navigation Control Drawer (Guaranteed above device bar) -->
        <aside class="w-full md:w-80 bg-slate-900/95 backdrop-blur border-t md:border-t-0 md:border-r border-slate-800 p-3.5 flex flex-col justify-between z-10 shrink-0 order-2 md:order-1 shadow-2xl max-h-[42vh] md:max-h-none overflow-y-auto">
            <div class="space-y-3">
                
                <!-- Search Feature Bar -->
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 flex items-center">
                        <i class="fa-solid fa-magnifying-glass text-emerald-400 mr-1.5"></i> Search Global Location
                    </label>
                    <div class="flex space-x-1.5">
                        <input id="search-input" type="text" placeholder="Type city or country..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 font-sans shadow-inner">
                        <button onclick="searchPlace()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-3 py-2 rounded-lg text-xs font-bold transition shrink-0">
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Quick Region Presets -->
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 flex items-center">
                        <i class="fa-solid fa-globe text-emerald-400 mr-1.5"></i> Quick Teleport Presets
                    </label>
                    <select id="region-preset" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                        <option value="">-- Select World Hub --</option>
                        <option value="35.6762,139.6503">Tokyo, Japan</option>
                        <option value="51.5074,-0.1278">London, United Kingdom</option>
                        <option value="40.7128,-74.0060">New York, USA</option>
                        <option value="-33.8688,151.2093">Sydney, Australia</option>
                        <option value="48.8566,2.3522">Paris, France</option>
                        <option value="25.2048,55.2708">Dubai, UAE</option>
                    </select>
                </div>

                <!-- Coordinates Readout Panel -->
                <div class="bg-slate-950/80 border border-slate-800 rounded-lg p-2.5 space-y-1 font-mono">
                    <div class="flex justify-between text-[10px]">
                        <span class="text-slate-500 flex items-center"><i class="fa-solid fa-location-crosshairs mr-1"></i> LAT:</span>
                        <span id="lat-display" class="text-emerald-400 font-bold">35.6762</span>
                    </div>
                    <div class="flex justify-between text-[10px]">
                        <span class="text-slate-500 flex items-center"><i class="fa-solid fa-location-crosshairs mr-1"></i> LNG:</span>
                        <span id="lng-display" class="text-emerald-400 font-bold">139.6503</span>
                    </div>
                </div>
            </div>

            <!-- Action Trigger Button -->
            <div class="space-y-1.5 pt-2 mt-auto">
                <button id="action-btn" onclick="toggleSpoof()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20 flex items-center justify-center space-x-2 text-xs uppercase tracking-wider">
                    <i class="fa-solid fa-power-off"></i>
                    <span id="btn-text">Start Spoofing</span>
                </button>
                <p id="feedback-txt" class="text-[9px] text-center text-slate-400 truncate">Tap map or search to target region.</p>
            </div>
        </aside>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        let map, marker;
        let currentLat = 35.6762;
        let currentLng = 139.6503;
        let isSpoofing = false;

        map = L.map('map', { zoomControl: false }).setView([currentLat, currentLng], 12);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        marker = L.marker([currentLat, currentLng], { draggable: true }).addTo(map);

        map.on('click', function(e) {
            updatePosition(e.latlng.lat, e.latlng.lng);
        });

        marker.on('dragend', function(e) {
            const pos = marker.getLatLng();
            updatePosition(pos.lat, pos.lng);
        });

        function updatePosition(lat, lng) {
            currentLat = lat;
            currentLng = lng;
            marker.setLatLng([lat, lng]);
            map.setView([lat, lng], map.getZoom());
            document.getElementById('lat-display').innerText = lat.toFixed(4);
            document.getElementById('lng-display').innerText = lng.toFixed(4);

            if (isSpoofing) {
                sendToServer(lat, lng);
            }
        }

        document.getElementById('region-preset').addEventListener('change', function() {
            const val = this.value;
            if (val) {
                const [lat, lng] = val.split(',').map(Number);
                updatePosition(lat, lng);
            }
        });

        function searchPlace() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            document.getElementById('feedback-txt').innerText = "Searching location...";
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lng = parseFloat(data[0].lon);
                        updatePosition(lat, lng);
                        document.getElementById('feedback-txt').innerText = "Found: " + data[0].display_name.split(',')[0];
                    } else {
                        document.getElementById('feedback-txt').innerText = "Location not found.";
                    }
                })
                .catch(() => {
                    document.getElementById('feedback-txt').innerText = "Search error occurred.";
                });
        }

        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchPlace();
        });

        function toggleSpoof() {
            isSpoofing = !isSpoofing;
            const badge = document.getElementById('status-badge');
            const btn = document.getElementById('action-btn');
            const btnText = document.getElementById('btn-text');

            if (isSpoofing) {
                badge.className = "px-2.5 py-1 rounded-full text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center";
                badge.innerHTML = '<i class="fa-solid fa-circle text-[5px] mr-1.5 animate-pulse"></i> SPOOFING ACTIVE';
                btn.className = "w-full bg-rose-500 hover:bg-rose-400 text-slate-950 font-black py-2.5 rounded-xl transition shadow-lg shadow-rose-500/20 flex items-center justify-center space-x-2 text-xs uppercase tracking-wider";
                btnText.innerText = "Stop Spoofing";
                sendToServer(currentLat, currentLng);
            } else {
                badge.className = "px-2.5 py-1 rounded-full text-[10px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20 flex items-center";
                badge.innerHTML = '<i class="fa-solid fa-circle text-[5px] mr-1.5 animate-pulse"></i> INACTIVE';
                btn.className = "w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20 flex items-center justify-center space-x-2 text-xs uppercase tracking-wider";
                btnText.innerText = "Start Spoofing";
                document.getElementById('feedback-txt').innerText = "Spoofing disabled.";
            }
        }

        function sendToServer(lat, lng) {
            fetch(`/set-location?lat=${lat}&lng=${lng}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('feedback-txt').innerText = data.message;
                })
                .catch(() => {
                    document.getElementById('feedback-txt').innerText = "Active at: " + lat.toFixed(2) + ", " + lng.toFixed(2);
                });
        }
    </script>
</body>
</html>
